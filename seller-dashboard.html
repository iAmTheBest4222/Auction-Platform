<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Auction Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Seller Dashboard</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="auctions.html">Auctions</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="seller-dashboard.html">Seller Dashboard</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <div class="dashboard-grid">
            <section class="quick-stats">
                <h2>Overview</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Active Listings</h3>
                        <p class="stat-number">12</p>
                    </div>
                    <div class="stat-card">
                        <h3>Items Sold</h3>
                        <p class="stat-number">45</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Revenue</h3>
                        <p class="stat-number">$2,450</p>
                    </div>
                </div>
            </section>

            <section class="new-listing">
                <h2>Create New Listing</h2>
                <form class="listing-form">
                    <div class="form-group">
                        <label for="title">Item Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="starting-bid">Starting Bid ($)</label>
                        <input type="number" id="starting-bid" required>
                    </div>
                    <div class="form-group">
                        <label for="buy-now">Buy Now Price ($)</label>
                        <input type="number" id="buy-now">
                    </div>
                    <div class="form-group">
                        <label for="duration">Auction Duration</label>
                        <select id="duration" required>
                            <option value="3">3 Days</option>
                            <option value="5">5 Days</option>
                            <option value="7">7 Days</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="images">Upload Images</label>
                        <input type="file" id="images" multiple accept="image/*">
                    </div>
                    <button type="submit" class="button">Create Listing</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
